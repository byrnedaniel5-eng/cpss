# cpss configuration template
#
# Generated by `python -m cpss init`. Edit the values below for your
# analysis, then run:
#
#   python -m cpss --config config_cpss.yaml
#
# Paths in this file are resolved relative to the directory you run the
# command from (not relative to this file).

# ── Required: input data ────────────────────────────────────────────────
# Path to the protein-level DIA-NN matrix (pg_matrix CSV). Peptide-level
# matrices (pr_matrix) are rejected at load time.
data_file: 'output.pg_matrix.csv'

# Path to the sample-label spreadsheet (.xlsx). Must contain at least
# (a) a column matching the sample IDs in the pg_matrix column headers, and
# (b) a group column with two values matching case_name and control_name.
label_file: 'group_labels.xlsx'

# Group labels in the label file. control_name → y=0, case_name → y=1.
control_name: "Non-cancer"
case_name:    "PDAC"

# Column names in the label file.
group_column:     "Group"
sample_id_column: "Biobank Number"

# ── Required: output ────────────────────────────────────────────────────
# Where stable_features_<ts>.csv, run_manifest_<ts>.json, and plots get
# written. Created if it doesn't exist.
output_dir: "cpss_results"

# ── Reproducibility ─────────────────────────────────────────────────────
random_state: 42

# ── Preprocessing ───────────────────────────────────────────────────────
# Drop proteins with > this fraction of missing values across samples.
# 0.0 = require complete cases.
max_missing: 0.0

# Apply log2(x+1) before z-scoring. Recommended for raw DIA-NN intensities.
log_transform: true

# Imputation strategy: "knn", "minimum", "mean", or "median".
imputation_strategy: "knn"
knn_neighbors: 5

# Drop proteins with N.Proteotypic.Sequences below this. DIA-NN's column.
min_proteotypic_peptides: 2

# ── Optional: upstream DIA-NN provenance (HC-INTER-03) ──────────────────
# Path to the DIA-NN log.txt, used to record FASTA/MBR/version details in
# the run manifest. Omit (or comment out) to let cpss auto-discover a
# *.log.txt next to data_file or in a sibling output directory.
# diann_log_file: '/path/to/DIA-NN output/output.log.txt'

# ── Machine learning ────────────────────────────────────────────────────
max_iterations: 10000

# ── Stability selection (Shah & Samworth 2013, r-concave bound) ─────────
# q: max non-zero coefficients retained per subsample (top by |β|).
max_candidates: 50

# 2 × B (B = complementary pairs). S&S §3.4.1 recommends B ≤ 50, so leave
# at 100 unless you understand the r-concavity assumption.
stability_iterations: 100

# Absolute PFER budget E[V] (expected number of false positives among
# stable features under the r-concave bound).
stability_pfer: 10

# ── ElasticNet ──────────────────────────────────────────────────────────
# Mixing parameter: 1 = lasso, 0 = ridge. l1_ratio ≥ 0.3 typically gives
# the sparsity needed for the q-cap to bind.
l1_ratio: 0.3

# ── Parallelism ─────────────────────────────────────────────────────────
# joblib n_jobs. -1 = all available CPU cores.
n_jobs: -1
